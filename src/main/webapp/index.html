<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio 6 JPA-1 - 3 corte</title>
<style>body{font:16px system-ui;background:#f4f6f9;color:#172b42;max-width:1000px;margin:40px auto;padding:20px}h1{font-size:28px}.forms{display:flex;gap:24px;flex-wrap:wrap}section{background:white;padding:24px;border:1px solid #dce2ea;border-radius:12px;flex:1;min-width:260px}label{display:block;margin:12px 0}input{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c4d1;border-radius:6px}button{background:#175cd3;color:white;border:0;border-radius:6px;padding:11px 18px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9eef5;padding:16px}small{color:#52647b}</style></head>
<body><small>Didier Perilla · Tercer corte</small><h1>Laboratorio 6 JPA-1 - 3 corte</h1><p>Registro de concursantes e inicio de sesión.</p>
<div class="forms"><section><h2>Registrar concursante</h2><form id="register">
<label>Nombre<input name="name" required></label><label>Apellido<input name="surname" required></label><label>Correo electrónico<input name="address" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" required autocomplete="new-password"></label><label>Edad<input name="age" type="number" min="0" value="20" required></label><label>Teléfono<input name="telephone" type="tel"></label><label>Celular<input name="cellphone" type="tel"></label><label>Ciudad<input name="city"></label><label>País<input name="country" value="Colombia"></label><button>Registrar</button></form></section>
<section><h2>Iniciar sesión</h2><form id="login"><label>Correo electrónico<input name="address" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><h2>Concursantes</h2><button id="list" type="button">Consultar concursantes</button><p>El listado se ordena por apellido.</p></section></div>
<h2>Resultado</h2><pre id="result" role="status" aria-live="polite">Registra un concursante para comenzar.</pre>
<script>
const result=document.getElementById('result');
async function request(path,data){try{const response=await fetch('rest/competitors/'+path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const text=await response.text();let body;try{body=JSON.stringify(JSON.parse(text),null,2);}catch{body=response.ok?text:'Revisa los datos enviados.';}result.textContent='HTTP '+response.status+'\n'+body;}catch{result.textContent='No se pudo conectar con el servidor.';}}
for(const [id,path] of [['register','add'],['login','login']])document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(id==='register')data.age=Number(data.age);await request(path,data);e.target.elements.password.value='';});
document.getElementById('list').addEventListener('click',()=>request('get'));
</script></body></html>
